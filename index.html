<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Whisky Collection</title></head><body><header><h1>🥃 Whisky Collection</h1><p>Ma collection personnelle</p></header><main><button id="addBtn">＋ Ajouter une bouteille</button> <button id="plusBtn">Plus</button><section><input id="search" placeholder="Rechercher une bouteille…"><div class="filters"><input id="filterDistillery" placeholder="Distillerie"><input id="filterCountry" placeholder="Pays / région"><input id="minScore" type="number" placeholder="Note min."><input id="maxPrice" type="number" placeholder="Prix max."><label><input id="inStock" type="checkbox"> En stock</label></div><div id="savedSearches"></div></section><section id="collection"></section><section><h2>📊 Statistiques</h2><div id="stats"></div></section><section><h2>📋 Historique des sorties</h2><div id="history"></div></section></main><div id="modal" class="modal hidden"><div class="box"><h2 id="modalTitle">Ajouter</h2><button id="closeModal">✕</button><input id="name" placeholder="Nom du whisky *"><input id="distillery" placeholder="Distillerie"><input id="country" placeholder="Pays / région"><input id="age" type="number" placeholder="Âge"><input id="abv" type="number" step=".1" placeholder="ABV %"><input id="volume" type="number" placeholder="Volume (cl)"><input id="qty" type="number" min="0" placeholder="Quantité"><input id="price" type="number" step=".01" placeholder="Prix (€)"><input id="score" type="number" min="0" max="100" placeholder="Note /100"><div id="photoPreview">Aucune photo</div><button id="libraryBtn">🖼️ Choisir dans ma photothèque</button><button id="cameraBtn">📷 Prendre une photo</button><button id="removePhotoBtn">🗑️ Supprimer la photo</button><input id="photoLibrary" type="file" accept="image/*" hidden><input id="photoCamera" type="file" accept="image/*" capture="environment" hidden><textarea id="notes" placeholder="Notes de dégustation…"></textarea><button id="cancelBtn">Annuler</button><button id="saveBtn">Enregistrer</button></div></div><div id="plusModal" class="modal hidden"><div class="box"><h2>Plus</h2><button id="closePlus">✕</button><button id="backupBtn">💾 Créer une sauvegarde</button><button id="restoreBtn">♻️ Restaurer la sauvegarde</button><button id="exportBtn">📦 Exporter ma collection</button><label>📥 Importer <input id="importFile" type="file" accept=".json,application/json"></label></div></div><script src="app.js"></script></body></html>
