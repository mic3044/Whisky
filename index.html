<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11100e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Whisky Collection"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Whisky Collection</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><div><div class="brand">🥃 Whisky Collection</div><div class="sub">Ma collection personnelle</div></div><button class="iconbtn" id="settingsBtn">⚙️</button></header><main><section id="home" class="screen active"><div class="stats"><div class="stat"><b id="count">0</b><span>Bouteilles</span></div><div class="stat"><b id="value">0 €</b><span>Valeur totale</span></div><div class="stat"><b id="gain">0 €</b><span>Plus-value</span></div><div class="stat"><b id="avg">0/100</b><span>Note moyenne</span></div></div><button class="primary big" id="addHome">＋ Ajouter une bouteille</button><h2>Dernières bouteilles</h2><div id="recent" class="list"></div></section><section id="collection" class="screen"><div class="sectionHead"><h1>Ma collection</h1><button class="primary small" id="addCollection">＋ Ajouter</button></div><input id="search" class="search" placeholder="🔎 Rechercher un whisky, une distillerie..."><div class="chips"><button data-filter="all" class="chip selected">Tous</button><button data-filter="open" class="chip">Ouverts</button><button data-filter="closed" class="chip">Fermés</button></div><div id="grid" class="grid"></div></section><section id="stats" class="screen"><h1>Statistiques</h1><div class="stats"><div class="stat"><b id="statCount">0</b><span>Bouteilles</span></div><div class="stat"><b id="statInvest">0 €</b><span>Investi</span></div><div class="stat"><b id="statGain">0 €</b><span>Plus-value</span></div><div class="stat"><b id="statBest">—</b><span>Meilleure note</span></div></div><div class="panel"><h3>Répartition par pays</h3><div id="countries"></div></div><div class="panel"><h3>Top 5 des notes</h3><div id="top"></div></div></section><section id="searchScreen" class="screen"><h1>Recherche</h1><input id="advancedSearch" class="search" placeholder="Nom, distillerie, pays..."><div id="searchResults" class="list"></div></section><section id="more" class="screen"><h1>Plus</h1><div class="panel"><button class="rowBtn" id="exportBtn">📤 Exporter ma collection</button><button class="rowBtn" id="importBtn">📥 Importer une collection</button><button class="rowBtn danger" id="resetBtn">🗑️ Effacer toutes les données</button><input type="file" id="fileInput" accept=".json" hidden></div></section></main><nav><button class="nav active" data-screen="home">⌂<span>Accueil</span></button><button class="nav" data-screen="collection">🥃<span>Collection</span></button><button class="nav" data-screen="stats">▥<span>Stats</span></button><button class="nav" data-screen="searchScreen">⌕<span>Recherche</span></button><button class="nav" data-screen="more">☰<span>Plus</span></button></nav></div><div id="modal" class="modal hidden"><div class="modalCard"><div class="modalHead"><h2 id="modalTitle">Ajouter une bouteille</h2><button id="closeModal">✕</button></div><form id="whiskyForm"><input type="hidden" id="editId"><label>Nom*<input id="name" required></label><label>Distillerie<input id="distillery"></label><div class="two"><label>Pays<input id="country" placeholder="Écosse"></label><label>Région<input id="region" placeholder="Islay"></label></div><div class="two"><label>Type<input id="type" placeholder="Single Malt"></label><label>Âge<input id="age" type="number" min="0"></label></div><div class="two"><label>Degré (%)<input id="abv" type="number" step="0.1"></label><label>Contenance (cl)<input id="volume" type="number"></label></div><div class="two"><label>Prix d'achat (€)<input id="purchase" type="number" step="0.01"></label><label>Valeur actuelle (€)<input id="current" type="number" step="0.01"></label></div><div class="two"><label>Quantité<input id="qty" type="number" min="1" value="1"></label><label>Note /100<input id="rating" type="number" min="0" max="100"></label></div><label class="check"><input id="opened" type="checkbox"> Bouteille ouverte</label><label>Nez<textarea id="nose"></textarea></label><label>Bouche<textarea id="palate"></textarea></label><label>Finale<textarea id="finish"></textarea></label><label>Notes personnelles<textarea id="notes"></textarea></label><label>Photo<input id="photo" type="file" accept="image/*"></label><img id="photoPreview" class="preview hidden"><button class="primary" type="submit">Enregistrer</button></form></div></div><script src="app.js"></script></body></html>
